<div class="min-h-screen bg-[#0A0E1A] flex items-center justify-center p-8">
  <div class="w-full max-w-[420px] text-center">

    @if (state === 'loading') {
      <div class="flex flex-col items-center gap-4">
        <div class="w-12 h-12 rounded-full border-2 border-[#C9A84C]/30 border-t-[#C9A84C] animate-spin"></div>
        <p class="font-['DM_Sans',sans-serif] text-sm text-[#E8D5A3]/50">Verifying your email…</p>
      </div>
    }

    @if (state === 'success') {
      <div class="flex flex-col items-center gap-5">
        <div class="w-16 h-16 rounded-full bg-[#C9A84C]/10 flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17L4 12" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="font-['Cinzel',serif] text-2xl font-semibold text-[#E8D5A3] m-0">Email verified!</h1>
        <p class="font-['DM_Sans',sans-serif] text-sm text-[#E8D5A3]/50 m-0">
          Your account is now active. You can sign in.
        </p>
        <a routerLink="/auth/sign-in">
          <p-button label="Sign in" styleClass="auth-btn" />
        </a>
      </div>
    }

    @if (state === 'error') {
      <div class="flex flex-col items-center gap-5">
        <div class="w-16 h-16 rounded-full bg-[#E07070]/10 flex items-center justify-center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="#E07070" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="font-['Cinzel',serif] text-2xl font-semibold text-[#E8D5A3] m-0">Verification failed</h1>
        <p class="font-['DM_Sans',sans-serif] text-sm text-[#E8D5A3]/50 m-0">{{ errorMessage }}</p>
        <a routerLink="/auth/sign-in" class="font-['DM_Sans',sans-serif] text-sm text-[#C9A84C] no-underline hover:underline">
          ← Back to sign in
        </a>
      </div>
    }

  </div>
</div>
