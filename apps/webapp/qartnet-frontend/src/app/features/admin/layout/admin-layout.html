<p-toast position="top-right" />
<p-confirmDialog />

<div class="min-h-screen bg-[#0A0E1A] flex">

  <!-- Sidebar -->
  <aside class="w-60 flex-shrink-0 bg-[#0D1221] border-r border-[#C9A84C]/10 flex flex-col">

    <!-- Logo -->
    <div class="px-5 py-5 border-b border-[#C9A84C]/10 flex items-center gap-3">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
        <polygon points="20,2 38,12 38,28 20,38 2,28 2,12" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
        <text x="20" y="25" text-anchor="middle" fill="#C9A84C" font-size="11" font-weight="600"
              font-family="'Cinzel', serif">Q</text>
      </svg>
      <div>
        <p class="font-['Cinzel',serif] text-[#E8D5A3] text-sm font-semibold m-0 leading-tight">QartNET</p>
        <p class="font-['DM_Sans',sans-serif] text-[#C9A84C]/50 text-[0.65rem] m-0 uppercase tracking-wider">Admin</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
      <a routerLink="dashboard" routerLinkActive="nav-active"
         class="nav-item">
        <i class="pi pi-chart-bar text-sm"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="users" routerLinkActive="nav-active"
         class="nav-item">
        <i class="pi pi-users text-sm"></i>
        <span>Users</span>
      </a>
      <a routerLink="reports" routerLinkActive="nav-active"
         class="nav-item">
        <i class="pi pi-flag text-sm"></i>
        <span>Reports</span>
      </a>
      <a routerLink="activity" routerLinkActive="nav-active"
         class="nav-item">
        <i class="pi pi-list text-sm"></i>
        <span>Activity</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="px-3 py-4 border-t border-[#C9A84C]/10 flex flex-col gap-1">
      <a routerLink="/profile"
         class="nav-item">
        <i class="pi pi-user text-sm"></i>
        <span>My profile</span>
      </a>
      <button (click)="logout()"
              class="nav-item w-full text-left text-[#E07070]/70 hover:text-[#E07070]">
        <i class="pi pi-sign-out text-sm"></i>
        <span>Sign out</span>
      </button>
    </div>

  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <router-outlet />
  </main>

</div>
