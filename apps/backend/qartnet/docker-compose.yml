services:
  postgres:
    image: postgres:16-alpine
    container_name: qartnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qartnet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fadhlielapgadmin
    ports:
      - "5432:5432"
    volumes:
      - qartnet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qartnet_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qartnet_pgdata:
