### Application ###
spring.application.name=qartnet
spring.profiles.active=local

### PostgreSQL ###
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qartnet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

### MongoDB ###
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/qartnet}

### Mail ###
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### JWT ###
jwt.secret=${JWT_SECRET:REPLACE_THIS_WITH_A_256_BIT_SECRET_IN_REAL_ENV}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

### Server ###
server.port=8080
server.servlet.context-path=/api

### CORS ###
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

### Git repository storage ###
git.repositories-base-path=${GIT_REPOS_PATH:/var/qartnet/repos}

### Logging ###
logging.level.com.qartnet=DEBUG
logging.level.org.springframework.security=INFO