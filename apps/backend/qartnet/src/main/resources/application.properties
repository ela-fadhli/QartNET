# Local dev overrides — values here take precedence over application.yml.
# Keep this file minimal. Do NOT redefine keys that are already correct in application.yml.

### PostgreSQL (local dev DB) ###
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=idriss

### MongoDB — disabled (not in use yet) ###
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

### Server ###
server.port=8082

### Mail — leave unconfigured so LogEmailServiceImpl fallback is used locally ###
spring.mail.host=
spring.mail.port=
management.health.mail.enabled=false

### Logging — verbose for local development ###
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
