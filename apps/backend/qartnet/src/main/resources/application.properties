### Application ###
spring.application.name=qartnet
spring.profiles.active=local

### MySQL ###
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qartnet?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


### Mail ###
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### JWT ###
jwt.secret=${JWT_SECRET:REPLACE_THIS_WITH_A_256_BIT_SECRET_IN_REAL_ENV}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

### Server ###
server.port=8080
server.servlet.context-path=/api

### CORS ###
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

### Git repository storage ###
git.repositories-base-path=${GIT_REPOS_PATH:/var/qartnet/repos}

### Logging ###
logging.level.tn.enicarthage.qartnet=DEBUG
logging.level.org.springframework.security=INFO